; M5Stack M5Tough (Core2-based) — Firefly Aerospace next-launch display
; Pulls launch data from The Space Devs Launch Library 2 API.

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    m5stack/M5Unified@^0.2.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/tzapu/WiFiManager.git
